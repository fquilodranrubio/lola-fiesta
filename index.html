const D={state:null,guests:[],agenda:[],asg:[],log:[],rounds:[],qrs:[],finds:[],att:[],su:[],loaded:false};
async function load(){
  const q=t=>sb.from(t).select('*');
  const [st,gu,ag,as,lg,vr,qr,fi,at,su,fo]=await Promise.all([q('state').eq('id',1).single(),q('guests'),q('agenda').order('ord'),q('assignments').eq('active',true),q('score_log').eq('void',false).order('id'),q('vote_rounds').order('id'),q('qr_codes').order('num'),q('qr_finds'),q('caja_attempts'),q('signups'),q('fotos').order('id',{ascending:false})]);
  for(const r of [st,gu,ag,as,lg,vr,qr,fi,at,su,fo])if(r.error)throw r.error;
  D.state=st.data;
  D.guests=gu.data.filter(g=>g.run===D.state.run&&!g.removed).sort((a,b)=>a.name.localeCompare(b.name));
  const ids=new Set(D.guests.map(g=>g.id));
  D.agenda=ag.data.filter(a=>!a.removed);D.asg=as.data.filter(a=>ids.has(a.guest_id));D.log=lg.data.filter(l=>ids.has(l.guest_id));
  const rs=+new Date(D.state.run_started_at||0);
  D.rounds=vr.data.filter(r=>+new Date(r.created_at)>=rs);
  D.qrs=qr.data;D.finds=fi.data.filter(f=>ids.has(f.guest_id));D.att=at.data.filter(a=>ids.has(a.guest_id));D.su=su.data.filter(a=>ids.has(a.guest_id));D.fotos=(fo.data||[]).filter(x=>!x.removed&&ids.has(x.guest_id));
  D.loaded=true;
}

async function resizeJpg(file){
  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)})}
  const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight,k=Math.min(1,1600/Math.max(w0,h0));
  const cv=document.createElement('canvas');cv.width=Math.round(w0*k);cv.height=Math.round(h0*k);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  for(const q of [.82,.7,.55,.4]){const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));if(b&&b.size<=1500000)return b}
  throw new Error('grande')
}

const LC=['#ff3ea5','#35e08c','#ffd166','#4cc9f0','#b388ff','#ff8a3d','#f0fff6','#ff6b6b','#2ec4b6','#c8e64c','#f78fb3','#8ecae6','#e07be0','#ffe66d','#6fffe9','#ffa07a'];
function chartData(){
  const P=ranking().map(x=>x.g);const n=P.length;if(n<2)return null;
  const ids=new Set(P.map(g=>g.id));
  const L=D.log.filter(l=>ids.has(l.guest_id)).map(l=>({id:l.guest_id,p:l.pts,t:l.cat==='disfraz'?Infinity:+new Date(l.created_at)}));
  const fin=L.filter(l=>isFinite(l.t)).map(l=>l.t);if(!fin.length)return null;
  const t0=+evStart(),t1=Math.max(...fin,t0+3600000),K=36;const pos=[];
  for(let i=0;i<=K;i++){
    const T=i===K?Infinity:t0+(t1-t0)*i/(K-1),tot={};P.forEach(g=>tot[g.id]=0);
    L.forEach(l=>{if(l.t<=T)tot[l.id]+=l.p});
    const ord=P.slice().sort((a,b)=>tot[b.id]-tot[a.id]||a.name.localeCompare(b.name));
    const m={};ord.forEach((g,r)=>m[g.id]=r+1);pos.push(m);
  }
  return {P,n,K,pos,t0,t1};
}
function chartSVG(CD,k){
  const W=800,H=500,pl=30,pr=130,pt=18,pb=34,n=CD.n,K=CD.K;
  const X=i=>pl+(W-pl-pr)*i/K,Y=p=>pt+(H-pt-pb)*(p-1)/(n-1);
  const win=CD.P.find(g=>CD.pos[K][g.id]===1);let o='';
  for(let r=1;r<=n;r++)o+=`<text x="${pl-10}" y="${Y(r)+5}" fill="#9fd1b6" font-size="14" text-anchor="end" font-family="IBM Plex Mono,monospace">${r}</text><line x1="${pl}" x2="${W-pr}" y1="${Y(r)}" y2="${Y(r)}" stroke="#2a6a4a" stroke-opacity=".25"/>`;
  for(let i=0;i<=K-4;i+=7){o+=`<text x="${X(i)}" y="${H-10}" fill="#9fd1b6" font-size="13" text-anchor="middle" font-family="IBM Plex Mono,monospace">${hm(new Date(CD.t0+(CD.t1-CD.t0)*i/(K-1)))}</text>`}
  o+=`<text x="${X(K)}" y="${H-10}" fill="#9fd1b6" font-size="13" text-anchor="middle" font-family="IBM Plex Mono,monospace">Final</text>`;
  const done=k>=K;
  CD.P.forEach((g,gi)=>{
    const col=LC[gi%LC.length],isW=done&&g.id===win.id,dim=done&&!isW;
    let pts='';for(let i=0;i<=k;i++)pts+=`${X(i).toFixed(1)},${Y(CD.pos[i][g.id]).toFixed(1)} `;
    const ex=X(k),ey=Y(CD.pos[k][g.id]);
    o+=`<g opacity="${dim?.3:1}"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${isW?8:4}" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${ex}" cy="${ey}" r="${isW?9:6}" fill="${col}"/><text x="${ex+14}" y="${ey+6}" fill="${col}" font-size="${isW?20:16}" font-weight="${isW?800:600}" font-family="Figtree,sans-serif">${esc(g.name)}${isW?' 👑':''}</text></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%" role="img" aria-label="Posición de cada invitado durante la noche">${o}</svg>`;
}
function startFinal(){
  const N=ranking().length;TVOV=null;const CD=chartData();
  TVANIM={type:'final',ph:CD?'chart':'count',k:0,cd:3,n:0,CD};renderTV();
  const step=()=>{if(!TVANIM)return;
   if(TVANIM.ph==='chart'){
     if(TVANIM.k<CD.K){TVANIM.k++;renderTV();setTimeout(step,TVANIM.k===CD.K?3500:320)}
     else{TVANIM.ph='count';TVANIM.cd=3;renderTV();setTimeout(step,1000)}
     return}
   if(TVANIM.cd>0)TVANIM.cd--;else if(TVANIM.n<N)TVANIM.n++;else{TVANIM=null;renderTV();return}
   renderTV();if(TVANIM.cd===0&&TVANIM.n===N)confetti();setTimeout(step,TVANIM.cd>0?1000:(TVANIM.n===N?3500:(TVANIM.n>=N-3?1600:900)))};
  setTimeout(step,CD?600:1000);
}

}

async resHit(){const a=$('#h1').value,b=$('#h2').value;if(!a)return;if(a===b)return toast('Elige dos personas distintas',true);

  const rest=all.filter(x=>x!==a&&x!==b);if(rest.length)await A('admin_points',{p_gids:rest,p_cat:'hitster',p_pts:1,p_note:'Partida de Hitster'});toast('Partida anotada')},
 async resBasta(){const v=[$('#b1').value,$('#b2').value,$('#b3').value];if(!v[0])return toast('Elige al menos el 1.º',true);if(new Set(v.filter(Boolean)).size!==v.filter(Boolean).length)return toast('No repitas personas',true);

 async gAdd(){const n=$('#ng-name').value.trim(),c=$('#ng-cos').value.trim(),p=$('#ng-pin').value.trim();if(!n||!/^\d{4}$/.test(p))return toast('Nombre y PIN de 4 números',true);await A('admin_guest_add',{p_name:n,p_costume:c,p_pin:p,p_role:'jugador'},n+' registrado')},
 gUpd(d){const v=d.x==='true'?true:d.x==='false'?false:d.x;A('admin_guest_update',{p_gid:d.v,p_data:{[d.k]:v}})},
 gPin(d){AFORM.pinFor=d.v;openModal(`<div class="card"><h3>Nuevo PIN para ${esc(gname(d.v))}</h3><input type="tel" id="mp" inputmode="numeric" maxlength="4"><div class="row"><button class="btn" data-act="gPinSave">Guardar</button><button class="btn ghost" data-act="modalClose">Cancelar</button></div></div>`)},
 async gPinSave(){const p=$('#mp').value.trim();if(!/^\d{4}$/.test(p))return toast('4 números',true);closeModal();await A('admin_guest_update',{p_gid:AFORM.pinFor,p_data:{pin:p}},'PIN cambiado')},
 gDel(d){openModal(`<div class="card"><h3>Quitar a ${esc(gname(d.v))}</h3><p class="mu">Desaparece de la lista, del marcador y de los grupos.</p><div class="row"><button class="btn bad" data-act="gDelOk" data-v="${d.v}">Quitar</button><button class="btn ghost" data-act="modalClose">Cancelar</button></div></div>`)},
 async gDelOk(d){closeModal();await A('admin_guest_delete',{p_gid:d.v},'Invitado quitado')},
 asu(d){A('admin_signup_set',{p_gid:d.v,p_game:d.g,p_play:d.p==='1'})},
 agG(d){AG.has(d.v)?AG.delete(d.v):AG.add(d.v);render()},
 async agGive(){await A('admin_points',{p_gids:[...AG],p_cat:'dibujo',p_pts:3,p_note:'Adivinó el personaje'},'+3 a quienes acertaron');AG.clear();render()},
 rReveal(d){A('admin_round_reveal',{p_round:+d.v},'Personaje revelado en la TV')},
 rVoting(d){A('admin_round_voting',{p_round:+d.v},'Votación abierta')},
 async rOpen(d){const ds=d.v==='dibujo'&&$('#desc')?$('#desc').value:null;AG.clear();const r=await A('admin_round_open',{p_kind:d.v,p_label:'',p_describer:ds},d.v==='dibujo'?'Ronda iniciada':'Votación abierta');if(d.v==='dibujo'&&r){ACHAR[r.id]=await rpc('admin_round_character',{p_admin:APIN,p_round:r.id});render()}},
 rClose(d){A('admin_round_close',{p_round:+d.v},'Votación cerrada y puntos sumados')},
 reveal1(){A('admin_state',{p_data:{votes_revealed:true}},'Mejor disfraz revelado en la TV')},
 reveal2(){A('admin_state',{p_data:{final_revealed:true}},'Revelación final en la TV')},
 unreveal(){A('admin_state',{p_data:{votes_revealed:false,final_revealed:false}},'Oculto de nuevo')},
 qOn(d){A('admin_qr_activate',{p_qr:+d.v,p_minutes:+d.m},'Relámpago activo. Di: "Alexa, alerta"')},
 qOff(d){A('admin_qr_off',{p_qr:+d.v},'Relámpago apagado')},
 async prizeSave(){const v=$('#prize').value.trim();if(!v)return;ASECRETS=await A('admin_secrets',{p_data:{prize_location:v}},'Lugar guardado')},
 cajaNow(){A('admin_state',{p_data:{caja_from:new Date().toISOString()}},'La caja ya se puede abrir')},
 cajaFri(){A('admin_state',{p_data:{caja_from:'2026-10-30T22:00:00-03:00'}},'Caja desde las 22:00 del viernes')},
 cajaSave(){const v=$('#cajaFrom').value;if(!v)return;A('admin_state',{p_data:{caja_from:new Date(v+':00-03:00').toISOString()}},'Hora de la caja guardada')},
 async cajaConfirm(){await A('admin_caja_confirm',{},'Cofre confirmado: +6 en el marcador')},
 tfStart(){A('admin_tf_start',{},'Sorteo iniciado')},
 tfNext(){A('admin_tf_next',{},'Siguiente turno')},
 tfEnd(){A('admin_tf_end',{},'Código mostrado en la TV')},
 tvChest(){if(APIN)return ACT.cajaConfirm();openModal(`<div class="card"><h3>Confirmar cofre</h3><p class="mu">PIN de árbitro</p><input type="password" id="tv-pin" inputmode="numeric" maxlength="8"><div class="row"><button class="btn" data-act="tvChestOk">Confirmar</button><button class="btn ghost" data-act="modalClose">Cancelar</button></div></div>`)},
 async tvChestOk(){const p=($('#tv-pin').value||'').trim();try{await rpc('admin_check',{p_admin:p});APIN=p;sstore.set('apin',p);closeModal();await ACT.cajaConfirm()}catch(e){toast(errMsg(e),true)}},
 printQR(){printPage()},
 async reset(){const c=$('#rs-c').value.trim();await A('admin_reset_all',{p_confirm:c},'Listo: todo desde cero');ALOG=[]},
 async newPin(){const p=$('#np').value.trim();if(p.length<4)return toast('Mínimo 4 números',true);await A('admin_secrets',{p_data:{new_admin_pin:p}},'PIN cambiado');APIN=p;sstore.set('apin',p)},
 modalClose(){closeModal()}
};
function openModal(h){const m=$('#modal');m.innerHTML=h;m.hidden=false}
function closeModal(){$('#modal').hidden=true}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();Promise.resolve(f(b.dataset)).catch(()=>{})}});
document.addEventListener('change',e=>{if(e.target.id==='fotoIn'){uploadFotos(e.target.files);return}if(e.target.dataset.ch==='baRound'){AFORM.ba=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')){const c=e.target.closest('.card');const b=c&&c.querySelector('.btn[data-act]');if(b&&!b.disabled)b.click()}});

/* ---------- Ciclo ---------- */
function render(){
  if(!D.loaded)return;
  const fe=document.activeElement;const fid=fe&&fe.id;const fv=fe&&fe.value;const keep={};
  document.querySelectorAll('input[id]:not([type=file]),select[id],textarea[id]').forEach(i=>{if(i.type!=='checkbox')keep[i.id]=i.value;else keep[i.id]=i.checked});
  if(VIEW==='tv'){tvDetect();renderTV();return}
  if(VIEW==='admin')renderAdmin();else renderGuest();
  Object.entries(keep).forEach(([k,v])=>{const i=document.getElementById(k);if(!i)return;if(i.type==='checkbox')i.checked=v;else if(v!==''&&v!=null)i.value=v});
  if(fid){const i=document.getElementById(fid);if(i){i.focus();try{if(fv!=null&&i.setSelectionRange&&i.type!=='number')i.setSelectionRange(fv.length,fv.length)}catch(e){}}}
}
function tick(){
  if(!D.loaded)return;
  if(VIEW==='tv'){const c=$('#tvclk');if(c)c.textContent=hm(Date.now());if(TVOV&&Date.now()>TVOV.until){TVOV=null;renderTV()}else if(((TVOV&&TVOV.type==='alerta')||(!TVOV&&!TVANIM))&&Date.now()%15000<1000)renderTV();return}
  document.querySelectorAll('[data-cd]').forEach(el=>{const m=Math.max(0,Math.ceil((+new Date(el.dataset.cd)-Date.now())/60000));el.textContent=m+' min'});
}
addEventListener('resize',()=>{if(VIEW==='tv')fitTV()});
(async()=>{
  $('#root').innerHTML='<div class="app"><div class="card"><p class="mu">Cargando la fiesta…</p></div></div>';
  await refresh();
  if(VIEW==='admin'&&APIN){await adminLoad();render()}
  if(VIEW==='tv'){TVPREV=null;tvDetect();renderTV()}
  subscribe();
})();
</script>
