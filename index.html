const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const sstore={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};

const catColor=k=>`var(--c-${CATS.some(c=>c[0]===k)?k:'otro'})`;
const ERR={pin_incorrecto:'El PIN no coincide.',registro_cerrado:'El registro está cerrado. Habla con Fernando.',nombre_invalido:'Escribe un nombre de hasta 24 letras.',pin_invalido:'El PIN son 4 números.',nombre_existe:'Ese nombre ya está registrado. Usa "Ya me registré".',no_existe:'No encontramos ese nombre.',votacion_cerrada:'La votación ya se cerró.',no_puedes_votarte:'No puedes votar por ti.',candidato_invalido:'No puedes votar por esa persona.',no_permitido:'No puedes hacer esto.',admin_pin_incorrecto:'PIN de árbitro incorrecto.',admin_bloqueado:'Demasiados intentos. Espera 10 minutos.',hay_votacion_abierta:'Primero cierra la votación abierta.',sin_descriptor_o_personaje:'No quedan descriptores o personajes disponibles.',confirmacion_incorrecta:'Escribe exactamente EMPEZAR DE NUEVO.'};
const errMsg=e=>{const m=(e&&(e.message||e.msg))||String(e);const k=Object.keys(ERR).find(k=>m.includes(k));return k?ERR[k]:'Algo falló. Revisa la conexión e inténtalo de nuevo.'};
function toast(t,bad){const e=$('#toast');e.textContent=t;e.className=bad?'bad':'';e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,3200)}
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw error;return data}

const params=new URLSearchParams(location.search);
const VIEW=params.get('v')==='tv'?'tv':params.get('v')==='admin'?'admin':'guest';
const QR_TOKEN=params.get('qr');
if(QR_TOKEN)store.set('pendingQR',QR_TOKEN);

/* ---------- Datos ---------- */
const D={state:null,guests:[],agenda:[],asg:[],log:[],rounds:[],qrs:[],finds:[],att:[],loaded:false};
async function load(){
  const q=t=>sb.from(t).select('*');
  const [st,gu,ag,as,lg,vr,qr,fi,at]=await Promise.all([q('state').eq('id',1).single(),q('guests'),q('agenda').order('ord'),q('assignments').eq('active',true),q('score_log').eq('void',false).order('id'),q('vote_rounds').order('id'),q('qr_codes').order('num'),q('qr_finds'),q('caja_attempts')]);
  for(const r of [st,gu,ag,as,lg,vr,qr,fi,at])if(r.error)throw r.error;
  D.state=st.data;
  D.guests=gu.data.filter(g=>g.run===D.state.run&&!g.removed).sort((a,b)=>a.name.localeCompare(b.name));
  const ids=new Set(D.guests.map(g=>g.id));
  D.agenda=ag.data.filter(a=>!a.removed);D.asg=as.data.filter(a=>ids.has(a.guest_id));D.log=lg.data.filter(l=>ids.has(l.guest_id));
  const rs=+new Date(D.state.run_started_at||0);
  D.rounds=vr.data.filter(r=>+new Date(r.created_at)>=rs);
  D.qrs=qr.data;D.finds=fi.data.filter(f=>ids.has(f.guest_id));D.att=at.data.filter(a=>ids.has(a.guest_id));
  D.loaded=true;
}
let rT=null;
function schedule(){clearTimeout(rT);rT=setTimeout(refresh,250)}
async function refresh(){try{await load();await afterLoad();render()}catch(e){console.error(e);if(!D.loaded)$('#root').innerHTML=`<div class="app"><div class="card"><h2>Sin conexión</h2><p class="mu">No pudimos cargar la fiesta. Revisa tu internet y recarga la página.</p></div></div>`}}
function subscribe(){
  const ch=sb.channel('fiesta');
  ['state','guests','agenda','assignments','score_log','vote_rounds','qr_codes','qr_finds','caja_attempts'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},schedule));
  ch.subscribe();
  setInterval(refresh,20000);
  setInterval(()=>tick(),1000);
}
const players=()=>D.guests.filter(g=>g.role==='jugador'&&g.status==='activo');
const gname=id=>{const g=D.guests.find(x=>x.id===id);return g?g.name:'?'};
function totals(){
  const m={};D.guests.forEach(g=>m[g.id]={g,t:0,b:{}});
  D.log.forEach(l=>{const x=m[l.guest_id];if(!x)return;x.t+=l.pts;x.b[l.cat]=(x.b[l.cat]||0)+l.pts});
  return m;
}
function ranking(){
  const m=totals();const arr=Object.values(m).filter(x=>x.g.role==='jugador').sort((a,b)=>b.t-a.t||a.g.name.localeCompare(b.g.name));
  let r=0,p=null;arr.forEach((x,i)=>{if(x.t!==p){r=i+1;p=x.t}x.r=r});return arr;
}
const evStart=()=>new Date(D.state.event_start);
const agTime=a=>new Date(+evStart()+a.start_min*60000);
function curAgenda(){
  if(!D.agenda.length)return null;
  if(D.state.current_agenda){const a=D.agenda.find(x=>x.id===D.state.current_agenda);if(a)return a}
  const now=Date.now();let cur=null;
  D.agenda.forEach(a=>{if(a.status!=='saltado'&&+agTime(a)<=now)cur=a});
  return cur;
}
function nextAgenda(cur){const i=cur?D.agenda.indexOf(cur):-1;return D.agenda.slice(i+1).find(a=>a.status!=='saltado')||null}
const sealed=()=>D.state.votes_revealed&&!D.state.final_revealed;
const activeFlash=()=>D.qrs.filter(q=>q.kind==='rel'&&q.active_from&&Date.now()<+new Date(q.active_until));
function myMesa(gid){
  const cur=curAgenda();if(!cur)return null;
  const k=cur.kind;
  if(k==='hitster'){const a=D.asg.find(x=>x.block==='hitster'&&x.guest_id===gid);if(!a)return{t:'Hitster Bingo',s:'Aún sin pareja. Fernando la asigna.'};const mates=D.asg.filter(x=>x.block==='hitster'&&x.team===a.team&&x.guest_id!==gid).map(x=>gname(x.guest_id));return{t:'Hitster Bingo',s:`${a.team}${mates.length?' con '+mates.join(' y '):''} · Living`}}
  if(k==='rondaA'||k==='rondaB'){const a=D.asg.find(x=>x.block===k&&x.guest_id===gid);if(!a)return{t:cur.title,s:'Aún sin mesa. Fernando te asigna.'};const n=D.asg.filter(x=>x.block===k&&x.game===a.game).length;return{t:a.game,s:`${a.zone} · ${n} jugadores`}}
  if(k==='dibujo')return{t:'Dibujo a ciegas',s:'Todos en el living, con papel y lápiz'};

function disfrazOv(){
  const by={};D.log.filter(l=>l.cat==='disfraz').forEach(l=>by[l.guest_id]=(by[l.guest_id]||0)+l.pts);
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const g=id=>D.guests.find(x=>x.id===id)||{name:'?',costume:''};
  const order=[top[1],top[0],top[2]];const hts=[150,210,110];const pl=['2.º','1.º','3.º'];
  return `<div class="tvov"><div class="h" style="font-size:64px">Mejor disfraz</div><div class="podium">${order.map((t,i)=>t?`<div><b>${esc(g(t[0]).name)}</b><small>${esc(g(t[0]).costume)} · +${t[1]}</small><i style="height:${hts[i]}px">${pl[i]}</i></div>`:'<div></div>').join('')}</div></div>`;
}
function renderTV(){
  document.body.classList.add('tvmode');
  if(!$('#tvstage'))$('#root').innerHTML='<div class="tvwrap" id="tvwrap"><div class="tvstage" id="tvstage"></div></div>';
  $('#tvstage').innerHTML=tvHTML();fitTV();
}
function fitTV(){const w=$('#tvwrap');if(!w)return;const s=Math.min(w.clientWidth/1280,w.clientHeight/720);$('#tvstage').style.transform=`translate(${(w.clientWidth-1280*s)/2}px,${(w.clientHeight-720*s)/2}px) scale(${s})`}
function tvDetect(){
  const st=D.state;const p=TVPREV;TVPREV={msgAt:st.tv_message_at,caja:st.caja_opened_at,vr:st.votes_revealed,fr:st.final_revealed,closed:D.rounds.filter(r=>r.status==='cerrada'&&r.kind==='dibujo').map(r=>r.id).join()};
  if(!p)return;
  if(st.tv_message_at&&st.tv_message_at!==p.msgAt&&(st.tv_message||'').startsWith('alerta:')){TVOV={type:'alerta',q:+st.tv_message.split(':')[1],until:Date.now()+20000}}
  if(st.caja_opened_at&&st.caja_opened_at!==p.caja){TVOV={type:'caja',until:Date.now()+15000};setTimeout(confetti,100)}
  const nowClosed=D.rounds.filter(r=>r.status==='cerrada'&&r.kind==='dibujo');const newC=nowClosed.find(r=>!p.closed.split(',').includes(String(r.id)));
  if(newC&&newC.revealed_character)TVOV={type:'dibujo',c:newC.revealed_character,until:Date.now()+12000};
  if(st.votes_revealed&&!p.vr){TVOV={type:'disfraz',until:Date.now()+20000};setTimeout(confetti,400)}
  if(st.final_revealed&&!p.fr)startFinal();
}
function startFinal(){
  const N=ranking().length;TVOV=null;TVANIM={type:'final',cd:3,n:0};renderTV();
  const step=()=>{if(!TVANIM)return;if(TVANIM.cd>0)TVANIM.cd--;else if(TVANIM.n<N)TVANIM.n++;else{TVANIM=null;renderTV();return}
   renderTV();if(TVANIM.cd===0&&TVANIM.n===N)confetti();setTimeout(step,TVANIM.cd>0?1000:(TVANIM.n===N?3500:(TVANIM.n>=N-3?1600:900)))};
  setTimeout(step,1000);
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cv=$('#tvcf');if(!cv)return;const x=cv.getContext('2d');
  const cols=['#e0a93b','#e5568a','#4a90e8','#2fbf8a','#9a8fee','#e8703a'];
  const P=Array.from({length:180},()=>({x:Math.random()*1280,y:-20-Math.random()*400,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:8+Math.random()*10,c:cols[Math.random()*cols.length|0],r:Math.random()*6}));
  let f=0;(function st(){const c=$('#tvcf');if(!c)return;const k=c.getContext('2d');k.clearRect(0,0,1280,720);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.12;k.save();k.translate(p.x,p.y);k.rotate(p.r);k.fillStyle=p.c;k.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);k.restore()});if(++f<260)requestAnimationFrame(st);else k.clearRect(0,0,1280,720)})();
}

/* ---------- Imprimir carteles ---------- */
function printPage(){
  const base=location.origin+location.pathname;
  const cards=AQR.map(q=>{const qr=qrcode(0,'M');qr.addData(base+'?qr='+q.token);qr.make();
    return `<div class="pc"><div class="pt">Misterio en casa de Lola</div>${qr.createSvgTag({cellSize:8,margin:2,scalable:true})}<div class="pn">${q.real_kind==='entrada'?'Escanea para entrar al caso':'Cartel '+q.num}</div><div class="pp">${esc(q.place)} · ${q.real_kind}</div></div>`}).join('');
  const w=window.open('','_blank');
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>Carteles QR</title><style>body{font-family:Georgia,serif;margin:0}.pc{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;page-break-after:always}.pc svg{width:70vmin;height:70vmin}.pt{font-size:28px}.pn{font-size:44px;font-weight:bold}.pp{font:12px monospace;color:#888}@media print{.pp{color:#bbb}}</style></head><body>${cards}<script>setTimeout(()=>print(),500)<\/script></body></html>`;
  if(w){w.document.write(html);w.document.close()}else toast('Permite ventanas emergentes para imprimir',true);
}

/* ---------- Ciclo ---------- */
function render(){
  if(!D.loaded)return;
  const fe=document.activeElement;const fid=fe&&fe.id;const fv=fe&&fe.value;const keep={};
  document.querySelectorAll('input[id],select[id],textarea[id]').forEach(i=>{if(i.type!=='checkbox')keep[i.id]=i.value;else keep[i.id]=i.checked});
  if(VIEW==='tv'){tvDetect();renderTV();return}
  if(VIEW==='admin')renderAdmin();else renderGuest();
  Object.entries(keep).forEach(([k,v])=>{const i=document.getElementById(k);if(!i)return;if(i.type==='checkbox')i.checked=v;else if(v!==''&&v!=null)i.value=v});
  if(fid){const i=document.getElementById(fid);if(i){i.focus();try{if(fv!=null&&i.setSelectionRange&&i.type!=='number')i.setSelectionRange(fv.length,fv.length)}catch(e){}}}
}
function tick(){
  if(!D.loaded)return;
  if(VIEW==='tv'){const c=$('#tvclk');if(c)c.textContent=hm(Date.now());if(TVOV&&Date.now()>TVOV.until){TVOV=null;renderTV()}else if(TVOV&&TVOV.type==='alerta'&&Date.now()%15000<1000)renderTV();return}
  document.querySelectorAll('[data-cd]').forEach(el=>{const m=Math.max(0,Math.ceil((+new Date(el.dataset.cd)-Date.now())/60000));el.textContent=m+' min'});
}
addEventListener('resize',()=>{if(VIEW==='tv')fitTV()});

  $('#root').innerHTML='<div class="app"><div class="card"><p class="mu">Cargando la fiesta…</p></div></div>';
  await refresh();

  if(VIEW==='tv'){TVPREV=null;tvDetect();renderTV()}
  subscribe();
})();
