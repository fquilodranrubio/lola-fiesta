<!doctype html>
<html lang="es">
<head>

<title>Niver de Lola 🎂</title>

<style>
:root{color-scheme:dark;
--bg:#07160f;--sf:#0f2a1d;--sf2:#173b29;--line:#2a6a4a;--tx:#f0fff6;--mu:#9fd1b6;--ac:#ff3ea5;--acink:#2a0017;--hot:#35e08c;--hotink:#04210f;--ok:#5ff0a8;--bad:#ff7a7a;
--c-hitster:#4aa8ff;--c-justone:#2fe08a;--c-basta:#ffc83d;--c-dibujo:#ff9ad0;--c-tesoro:#a58bff;--c-extras:#ff9a4a;--c-disfraz:#ff2e9a;--c-otro:#d9d4e6;
--f-disp:'Lilita One',Georgia,serif;--f-body:'Figtree',system-ui,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
body{background:radial-gradient(ellipse at 50% -10%,#0f5a37 0,var(--bg) 60%) fixed,var(--bg)}
.card.hl{background:linear-gradient(155deg,#14452f,var(--sf))}
.brand{text-shadow:0 2px 0 #7a0f48}
html,body{margin:0;background-color:var(--bg);color:var(--tx)}
body{font:400 15px/1.5 var(--f-body);padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.tvmode{padding:0;overflow:hidden;height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.mu{color:var(--mu)}.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ic{width:1em;height:1em;vertical-align:-.14em;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{max-width:520px;margin:0 auto;display:grid;gap:14px;padding-top:14px}
.adm{max-width:760px}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 4px}
.brand{font:400 22px/1.05 var(--f-disp);color:var(--ac)}
.brand small{display:block;font:500 11px var(--f-body);color:var(--mu);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;text-align:right}
.who b{display:block;line-height:1.15}.who small{color:var(--mu)}
.av{width:38px;height:38px;border-radius:50%;background:var(--hot);color:var(--hotink);display:grid;place-items:center;font:400 18px var(--f-disp);flex:none}
.tabs{display:flex;gap:2px;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:3px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow-x:auto}
.tabs button{flex:1;background:none;border:0;padding:9px 8px;border-radius:9px;color:var(--mu);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--ac);color:var(--acink)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card.hl{border-color:var(--ac)}
.card h3{font:500 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--mu)}
.card h2{font:400 24px/1.15 var(--f-disp);color:var(--ac)}
.big{font:400 52px/1 var(--f-disp);color:var(--ac)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{margin-left:auto}
.btn{background:var(--ac);color:var(--acink);border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;min-height:42px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ac)}
.btn.hot{background:var(--hot);color:var(--hotink)}
.btn.bad{background:none;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;min-height:34px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;font:500 11px var(--f-mono);padding:2px 8px;border-radius:999px;background:var(--sf2);border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.badge.ac{color:var(--ac);border-color:var(--ac)}.badge.ok{color:var(--ok);border-color:var(--ok)}.badge.bad{color:var(--bad);border-color:var(--bad)}.badge.hot{color:var(--hot);border-color:var(--hot)}
.alertb{background:var(--hot);color:var(--hotink);border-radius:14px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center}
.alertb span{font-weight:400}
.fld{display:grid;gap:4px}.fld label{font-size:13px;color:var(--mu)}
input[type=text],input[type=password],input[type=number],input[type=tel],input[type=datetime-local],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--ac);outline:0}
.err{color:var(--bad);font-size:14px}.okt{color:var(--ok);font-size:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{accent-color:var(--ac);width:18px;height:18px}
.list{display:grid}
.li{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font:500 13px var(--f-mono);min-width:46px;color:var(--mu);padding-top:1px}
.li.now .t,.li.now b{color:var(--ac)}
.li.done{opacity:.55}
.li.skip b{text-decoration:line-through}
.pick{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:48px}
.pick.on{border-color:var(--ac);background:#3a1233}
.pick small{color:var(--mu);display:block;line-height:1.2}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:500;display:flex;gap:8px;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
details p{color:var(--mu);margin-top:6px;font-size:14px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mu)}
.legend span{display:flex;align-items:center;gap:5px}
.brow{display:grid;grid-template-columns:22px minmax(70px,120px) 1fr 34px;align-items:center;gap:8px;min-height:var(--rh,34px)}
.brow .rk{font:500 12px var(--f-mono);color:var(--mu);text-align:right}
.brow .bn{font-weight:500;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bn small{display:block;font-weight:400;font-size:11px;color:var(--mu);overflow:hidden;text-overflow:ellipsis}
.bbar{display:flex;height:18px;background:var(--sf2);border-radius:4px;overflow:hidden}
.bbar i{display:block;height:100%;margin-right:2px;border-radius:2px}
.bbar.seal{background:repeating-linear-gradient(135deg,var(--sf2) 0 8px,var(--sf) 8px 16px)}
.bt{font:500 16px var(--f-mono);text-align:right}
.brow.me .bn{color:var(--ac)}
.brow.win .bn,.brow.win .bt{color:var(--ac)}
.sel{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--sf2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--tx);min-height:34px}
.chip.on{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.chip.off{opacity:.5}
.tbl{display:grid}
.tr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.tr:first-child{border-top:0}
.tr small{color:var(--mu);display:block;line-height:1.3}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:13px;padding:4px 8px;text-decoration:underline}
.x:hover{color:var(--bad)}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grp h4{margin:0 0 4px;font:400 17px var(--f-disp);color:var(--ac)}
.grp div{font-size:14px}
.secret{font:400 40px/1.1 var(--f-disp);color:var(--hot);text-align:center;padding:10px 0}
.clue{background:var(--sf2);border-radius:10px;padding:10px 12px;font-size:15px}
.clue small{display:block;color:var(--mu);font-size:12px;margin-bottom:2px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--acink);font-weight:700;padding:11px 16px;border-radius:12px;z-index:50;max-width:90vw;text-align:center}

.modal{position:fixed;inset:0;background:rgba(10,8,16,.86);z-index:40;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:440px;width:100%}
.adm-nav{display:flex;flex-wrap:wrap;gap:6px}
.kbd{font:500 13px var(--f-mono);background:var(--sf2);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.note{font-size:12px;color:var(--mu);text-align:center}

.tvwrap{position:fixed;inset:0;background:radial-gradient(ellipse at 50% -10%,#0f5a37 0,#07160f 65%)}
.tvstage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden}
.tvh{height:76px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--line)}
.tvlogo{font:400 32px var(--f-disp);color:var(--ac)}
.tvclk{font:500 40px var(--f-mono)}
.tvmeta{font-size:18px;color:var(--mu);text-align:right}
.tvm{flex:1;min-height:0;display:grid;grid-template-columns:1fr 400px;gap:36px;padding:18px 40px 14px}
.tvl{min-height:0;display:flex;flex-direction:column;gap:8px}
.tvl h2{font:500 15px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.tvr{display:flex;flex-direction:column;gap:14px;min-height:0}
.tvc{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:grid;gap:4px}
.tvc h3{font:500 13px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.tvc .v{font:400 28px/1.15 var(--f-disp);color:var(--ac)}
.tvc p{font-size:17px}
.tvstage .brow{grid-template-columns:34px 230px 1fr 60px;gap:16px}
.tvstage .brow .bn{font-size:22px}.tvstage .brow .bn small{font-size:13px}
.tvstage .bbar{height:24px}.tvstage .bt{font-size:28px}.tvstage .brow .rk{font-size:18px}
.tvstage .legend{font-size:14px}
.tvstrip{flex:none;height:40px;background:var(--hot);color:var(--hotink);font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px}
.tvov{position:absolute;inset:0;background:rgba(5,20,13,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;z-index:5}
.tvov .h{font:400 84px/1 var(--f-disp);color:var(--ac)}
.tvov .s{font-size:30px}
.tvov .n{font:500 120px/1 var(--f-mono);color:var(--hot)}
.podium{display:flex;align-items:flex-end;gap:28px;margin-top:10px}
.podium div{display:grid;gap:8px;justify-items:center;width:240px}
.podium b{font:400 34px/1.1 var(--f-disp);color:var(--tx)}
.podium small{font-size:18px;color:var(--mu)}
.podium i{display:block;width:100%;border-radius:10px 10px 0 0;background:var(--sf2);border:1px solid var(--line);font:400 54px/1 var(--f-disp);color:var(--ac);padding-top:14px;font-style:normal}
.tvcf{position:absolute;inset:0;pointer-events:none;z-index:6}
.pop{animation:pop .55s ease-out both}
@keyframes pop{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.hid{visibility:hidden}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
.tabs button .te{display:block;font-size:18px;line-height:1.25}
.lg svg{width:30px;height:30px;vertical-align:-8px;margin-right:8px}
.lg.tv svg{width:50px;height:50px;vertical-align:-12px;margin-right:12px}
#trans{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#ff7cc4 0,#ff3ea5 45%,#b8146f 100%);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s,visibility 0s .22s}
#trans.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .22s}
#trans.off{opacity:0;pointer-events:none}
.tbox{text-align:center;color:#fff;animation:tbob .5s ease-in-out infinite alternate}
.tbox svg{width:150px;height:150px;filter:drop-shadow(0 6px 0 #0003)}
.tbox p{font:400 28px var(--f-disp);margin-top:8px;text-shadow:0 2px 0 #7a0f48}
@keyframes tbob{from{transform:translateY(6px) rotate(-3deg)}to{transform:translateY(-8px) rotate(3deg)}}
.tvov .ill svg{width:200px;height:200px;animation:tbob .6s ease-in-out infinite alternate}
@media(prefers-reduced-motion:reduce){.tbox,.tvov .ill svg{animation:none}}
</style>
</head>

const D={state:null,guests:[],agenda:[],asg:[],log:[],rounds:[],qrs:[],finds:[],att:[],loaded:false};
async function load(){
  const q=t=>sb.from(t).select('*');
  const [st,gu,ag,as,lg,vr,qr,fi,at]=await Promise.all([q('state').eq('id',1).single(),q('guests'),q('agenda').order('ord'),q('assignments').eq('active',true),q('score_log').eq('void',false).order('id'),q('vote_rounds').order('id'),q('qr_codes').order('num'),q('qr_finds'),q('caja_attempts')]);
  for(const r of [st,gu,ag,as,lg,vr,qr,fi,at])if(r.error)throw r.error;
  D.state=st.data;
  D.guests=gu.data.filter(g=>g.run===D.state.run&&!g.removed).sort((a,b)=>a.name.localeCompare(b.name));
  const ids=new Set(D.guests.map(g=>g.id));
  D.agenda=ag.data.filter(a=>!a.removed);D.asg=as.data.filter(a=>ids.has(a.guest_id));D.log=lg.data.filter(l=>ids.has(l.guest_id));
  const rs=+new Date(D.state.run_started_at||0);
  D.rounds=vr.data.filter(r=>+new Date(r.created_at)>=rs);
  D.qrs=qr.data;D.finds=fi.data.filter(f=>ids.has(f.guest_id));D.att=at.data.filter(a=>ids.has(a.guest_id));
  D.loaded=true;
}

function confetti(){

  const html=`<!doctype html><html><head><meta charset="utf-8"><title>Carteles QR</title><style>body{font-family:Georgia,serif;margin:0}.pc{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;page-break-after:always}.pc svg{width:70vmin;height:70vmin}.pt{font-size:28px}.pn{font-size:44px;font-weight:bold}.pp{font:12px monospace;color:#888}@media print{.pp{color:#bbb}}</style></head><body>${cards}<script>setTimeout(()=>print(),500)<\/script></body></html>`;
  if(w){w.document.write(html);w.document.close()}else toast('Permite ventanas emergentes para imprimir',true);
}

/* ---------- Acciones ---------- */
const ACT={
 tab(d){if(d.v===TAB)return;transition(()=>{TAB=d.v;if(d.v!=='tesoro'&&d.v!=='inicio')SCANRES=null;render();scrollTo(0,0)})},

 closeScan(){SCANRES=null;render()},
 async register(){

 },

 },
 logout(){ME=null;store.del('me');AUTH='login';render()},
 async vote(d){try{await rpc('vote',{p_gid:ME.gid,p_pin:ME.pin,p_round:+d.r,p_target:d.v});MYVOTE[d.r]=d.v;toast('Voto guardado ✅');render()}catch(e){toast(errMsg(e),true)}},

  try{const r=await rpc('try_caja',{p_gid:ME.gid,p_pin:ME.pin,p_code:v});

   CAJAMSG={t:M[r.status]||r.status,ok:r.status==='abierta',premio:r.premio};await refresh()}catch(e){toast(errMsg(e),true)}
 },
 async adminLogin(){const p=$('#ad-pin').value.trim();try{await rpc('admin_check',{p_admin:p});APIN=p;sstore.set('apin',p);await adminLoad();render()}catch(e){toast(errMsg(e),true)}},
 adminOut(){APIN=null;sstore.set('apin','');render()},
 aSec(d){ASEC=d.v;render();scrollTo(0,0)},
 agNext(){const cur=curAgenda();const nx=nextAgenda(cur);if(!nx)return;const p=[];if(cur)p.push(A('admin_agenda_update',{p_id:cur.id,p_data:{status:'hecho'}}));Promise.all(p).then(()=>A('admin_state',{p_data:{current_agenda:nx.id}},nx.alexa?'Di: "'+nx.alexa+'"':'Bloque cambiado'))},
 agPrev(){const cur=curAgenda();const i=cur?D.agenda.indexOf(cur):0;const pv=D.agenda[i-1];if(pv)A('admin_state',{p_data:{current_agenda:pv.id}})},
 agAuto(){A('admin_state',{p_data:{current_agenda:null}},'Bloque automático por hora')},
 agSet(d){A('admin_state',{p_data:{current_agenda:+d.v}},'Bloque cambiado')},

 regToggle(){A('admin_state',{p_data:{reg_open:!D.state.reg_open}})},

 async resHit(){const t1=$('#h1').value,t2=$('#h2').value;if(t1===t2)return toast('Elige dos parejas distintas',true);const teams={};D.asg.filter(a=>a.block==='hitster').forEach(a=>(teams[a.team]=teams[a.team]||[]).push(a.guest_id));
  await A('admin_points',{p_gids:teams[t1],p_cat:'hitster',p_pts:5,p_note:'Primera línea'});if(t2)await A('admin_points',{p_gids:teams[t2],p_cat:'hitster',p_pts:3,p_note:'Segunda línea'});
  const rest=Object.entries(teams).filter(([k])=>k!==t1&&k!==t2).flatMap(([,v])=>v);if(rest.length)await A('admin_points',{p_gids:rest,p_cat:'hitster',p_pts:1,p_note:'Partida de Hitster'},'Partida anotada')},
 async resJO(){const b=$('#jo-b').value,n=+$('#jo-n').value;const ids=groupOf(b,'Just One');if(!ids.length)return toast('Ese grupo no tiene jugadores',true);const p=n>=11?4:n>=8?3:n>=5?2:1;await A('admin_points',{p_gids:ids,p_cat:'justone',p_pts:p,p_note:n+' aciertos'},`+${p} para ${ids.length} personas`)},
 async resBasta(){const v=[$('#b1').value,$('#b2').value,$('#b3').value];if(!v[0])return toast('Elige al menos el 1.º',true);if(new Set(v.filter(Boolean)).size!==v.filter(Boolean).length)return toast('No repitas personas',true);
  const pts=[3,2,1];for(let i=0;i<3;i++)if(v[i])await A('admin_points',{p_gids:[v[i]],p_cat:'basta',p_pts:pts[i],p_note:(i+1)+'.º en Basta'});toast('Partida anotada')},
 drawHit(){const p=shuffle(players().map(g=>g.id));const t=[];for(let i=0;i<p.length;i+=2)t.push(p.slice(i,i+2));if(t.length>1&&t[t.length-1].length===1)t[t.length-2].push(t.pop()[0]);saveHit(t)},
 hitLate(){const teams={};D.asg.filter(a=>a.block==='hitster').forEach(a=>(teams[a.team]=teams[a.team]||[]).push(a.guest_id));const arr=Object.keys(teams).sort((a,b)=>+a.split(' ')[1]-+b.split(' ')[1]).map(k=>teams[k]);const asg=new Set(arr.flat());players().filter(g=>!asg.has(g.id)).forEach(g=>{arr.sort((a,b)=>a.length-b.length)[0].push(g.id)});saveHit(arr)},
 drawGrp(){const pl=players();const sm=shuffle(pl.filter(g=>g.smoker).map(g=>g.id));const ns=shuffle(pl.filter(g=>!g.smoker).map(g=>g.id));const n1=Math.floor(pl.length/2);const g1=sm.slice(0,n1);const rest=[...sm.slice(n1),...ns];while(g1.length<n1)g1.push(rest.shift());saveGroups(g1,rest)},
 grpLate(){const g1=groupOf('rondaA','Just One'),g2=groupOf('rondaA','Basta');const asg=new Set([...g1,...g2]);players().filter(g=>!asg.has(g.id)).forEach(g=>(g1.length<=g2.length?g1:g2).push(g.id));saveGroups(g1,g2)},
 async gAdd(){const n=$('#ng-name').value.trim(),c=$('#ng-cos').value.trim(),p=$('#ng-pin').value.trim();if(!n||!/^\d{4}$/.test(p))return toast('Nombre y PIN de 4 números',true);await A('admin_guest_add',{p_name:n,p_costume:c,p_pin:p,p_role:$('#ng-spec').checked?'espectador':'jugador'},n+' registrado')},
 gUpd(d){const v=d.x==='true'?true:d.x==='false'?false:d.x;A('admin_guest_update',{p_gid:d.v,p_data:{[d.k]:v}})},
 gPin(d){AFORM.pinFor=d.v;openModal(`<div class="card"><h3>Nuevo PIN para ${esc(gname(d.v))}</h3><input type="tel" id="mp" inputmode="numeric" maxlength="4"><div class="row"><button class="btn" data-act="gPinSave">Guardar</button><button class="btn ghost" data-act="modalClose">Cancelar</button></div></div>`)},

 gDel(d){openModal(`<div class="card"><h3>Quitar a ${esc(gname(d.v))}</h3><p class="mu">Desaparece de la lista, del marcador y de los grupos.</p><div class="row"><button class="btn bad" data-act="gDelOk" data-v="${d.v}">Quitar</button><button class="btn ghost" data-act="modalClose">Cancelar</button></div></div>`)},

 qOff(d){A('admin_qr_off',{p_qr:+d.v},'Relámpago apagado')},
 async prizeSave(){const v=$('#prize').value.trim();if(!v)return;ASECRETS=await A('admin_secrets',{p_data:{prize_location:v}},'Lugar guardado')},
 cajaNow(){A('admin_state',{p_data:{caja_from:new Date().toISOString()}},'La caja ya se puede abrir')},

 printQR(){printPage()},

function openModal(h){const m=$('#modal');m.innerHTML=h;m.hidden=false}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();Promise.resolve(f(b.dataset)).catch(()=>{})}});
document.addEventListener('change',e=>{if(e.target.dataset.ch==='baRound'){AFORM.ba=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')){const c=e.target.closest('.card');const b=c&&c.querySelector('.btn[data-act]');if(b&&!b.disabled)b.click()}});

/* ---------- Ciclo ---------- */
function render(){
  if(!D.loaded)return;
  const fe=document.activeElement;const fid=fe&&fe.id;const fv=fe&&fe.value;const keep={};
  document.querySelectorAll('input[id],select[id],textarea[id]').forEach(i=>{if(i.type!=='checkbox')keep[i.id]=i.value;else keep[i.id]=i.checked});
  if(VIEW==='tv'){tvDetect();renderTV();return}
  if(VIEW==='admin')renderAdmin();else renderGuest();
  Object.entries(keep).forEach(([k,v])=>{const i=document.getElementById(k);if(!i)return;if(i.type==='checkbox')i.checked=v;else if(v!==''&&v!=null)i.value=v});
  if(fid){const i=document.getElementById(fid);if(i){i.focus();try{if(fv!=null&&i.setSelectionRange&&i.type!=='number')i.setSelectionRange(fv.length,fv.length)}catch(e){}}}
}
function tick(){
  if(!D.loaded)return;
  if(VIEW==='tv'){const c=$('#tvclk');if(c)c.textContent=hm(Date.now());if(TVOV&&Date.now()>TVOV.until){TVOV=null;renderTV()}else if(((TVOV&&TVOV.type==='alerta')||(!TVOV&&!TVANIM))&&Date.now()%15000<1000)renderTV();return}
  document.querySelectorAll('[data-cd]').forEach(el=>{const m=Math.max(0,Math.ceil((+new Date(el.dataset.cd)-Date.now())/60000));el.textContent=m+' min'});
}
addEventListener('resize',()=>{if(VIEW==='tv')fitTV()});
(async()=>{
  $('#root').innerHTML='<div class="app"><div class="card"><p class="mu">Cargando la fiesta…</p></div></div>';
  await refresh();
  if(VIEW==='admin'&&APIN){await adminLoad();render()}
  if(VIEW==='tv'){TVPREV=null;tvDetect();renderTV()}
  subscribe();
})();
</script>
